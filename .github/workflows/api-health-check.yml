# API Health Check Workflow
# Runs nightly to detect API changes before users encounter them

name: API Health Check

on:
  schedule:
    # Run at 6 AM UTC daily (midnight EST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck

      - name: Install nbastatR
        run: |
          R -e "install.packages('remotes')"
          R -e "remotes::install_local()"

      - name: Run API Health Check
        id: health-check
        run: |
          Rscript -e '
          library(nbastatR)

          cat("Running nbastatR API Health Check...\n\n")

          results <- api_health_check(
            endpoints = c("players", "teams"),
            verbose = TRUE
          )

          # Save results
          saveRDS(results, "health-check-results.rds")

          # Check for failures
          if (any(results$status == "ERROR")) {
            cat("\n\n API HEALTH CHECK FAILED\n")
            cat("Some endpoints returned errors.\n")
            quit(status = 1)
          }

          cat("\n\n All endpoints healthy!\n")
          '

      - name: Upload health check results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-check-results
          path: health-check-results.rds
          retention-days: 30

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'API Health Check Failed';
            const body = `
            The nightly API health check has detected issues with one or more endpoints.

            **Run:** ${context.runId}
            **Date:** ${new Date().toISOString()}

            Please investigate the failing endpoints and update the package if the API schema has changed.

            [View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['api-health', 'automated']
            });
